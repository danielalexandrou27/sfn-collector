monitor:
  sqs:
    # Set via environment variable MONITOR_SQS_QUEUE_URL, or edit here.
    queue-url: ${MONITOR_SQS_QUEUE_URL:https://sqs.us-west-2.amazonaws.com/060703039313/sfn-status-events}
    region: ${AWS_REGION:us-west-2}
    wait-time-seconds: 20        # long polling
    max-messages: 10             # batch size per receive
    visibility-timeout-seconds: 60
    credential-error-backoff-seconds: 60
    enabled: true

  informatica:
    # Turn on once the JDBC URL and a read-only account are filled in.
    enabled: ${INFA_REPO_ENABLED:false}
    # Oracle:     jdbc:oracle:thin:@//dbhost:1521/SERVICE_NAME
    # SQL Server: jdbc:sqlserver://dbhost:1433;databaseName=INFA_REPO;encrypt=true;trustServerCertificate=true
    jdbc-url: ${INFA_REPO_JDBC_URL:}
    # Credentials come from environment variables; never commit them.
    username: ${INFA_REPO_USER:}
    password: ${INFA_REPO_PASSWORD:}
    repo-schema: ${INFA_REPO_SCHEMA:}      # schema owning the OPB_ tables, e.g. INFA_REPO_PRD
    server-time-zone: America/Los_Angeles  # Informatica server's local time zone
    lookback-hours: 24
    poll-interval-ms: 60000
    query-timeout-seconds: 30
    folders: []                            # e.g. [LOANS, FINANCE]; empty = all folders

  # On FAILED / TIMED_OUT, read the execution history to find the failed state and service error.
  sfn-enricher:
    enabled: true
    max-history-events: 1000

  # ServiceNow incidents without the API: a prefilled new-incident link, submitted in a browser.
  incidents:
    enabled: ${INCIDENTS_ENABLED:false}
    mode: ${INCIDENTS_MODE:DRY_RUN}          # DRY_RUN = write the link to the outbox; BROWSER = open it and click Submit
    instance-url: ${SERVICENOW_URL:https://<instance>.service-now.com}
    statuses: [FAILED, TIMED_OUT, SUSPENDED] # add ABORTED to ticket manual stops too
    wait-for-detail-minutes: 3
    max-per-poll: 5
    time-zone: America/Los_Angeles
    aws-region: ${AWS_REGION:us-west-2}
    outbox-dir: ./data/incident-outbox
    closed-states: ["6", "7", "8"]           # Resolved, Closed, Canceled: a new failure gets a new incident
    # Fixed fields: ServiceNow INTERNAL field name -> INTERNAL value (sys_ids for reference fields).
    # Values from the incident list filter -> right-click breadcrumb -> Copy query (see README).
    fields:
      caller_id: "5badb313eb1d1e10f355fe7acad0cdb5"          # Daniel Alexandrou
      category: "application"                                # Application
      subcategory: "batch job"                               # Batch Job
      cmdb_ci: "afec946a931252107335738efaba10ac"            # ADW
      u_vendor_related: "no"                                 # Vendor Related = No
      contact_type: "email"                                  # Channel = Email
      assignment_group: "d7838333ebda1a10f355fe7acad0cda3"   # HCA EDW Application Support
      assigned_to: "5badb313eb1d1e10f355fe7acad0cdb5"        # Daniel Alexandrou
    # {{...}} placeholders: job, status_word, summary, detail, failed_step, attempts, run, started, ended,
    # duration, downstream, link, source_label, folder, run_id
    short-description-template: "{{job}} {{status_word}}"
    description-template: |
      {{summary}}

      Failed step: {{failed_step}} (attempts: {{attempts}})
      Run: {{run}}
      Started: {{started}}
      Ended: {{ended}}
      Downstream impact: {{downstream}}
      Link: {{link}}
    browser:
      channel: msedge                        # installed Edge: no browser download needed; or chrome / chromium
      headless: false                        # keep false until the sign-in is saved in the profile
      profile-dir: ./data/servicenow-browser-profile
      screenshot-dir: ./data/incident-screenshots
      login-wait-minutes: 5
      timeout-seconds: 30
    resolve:
      enabled: false                         # turn on once the values below are confirmed
      fields:
        state: "6"                           # Resolved
        close_code: "<resolution code value>"
        close_notes: "{{resolution}}"

  pipelines:
    file: ${PIPELINES_FILE:./config/pipelines.yml}
    link-window-hours: 36      # how far back to look for an upstream run
    pending-grace-minutes: 3   # wait before alerting on a non-OK link (Informatica polls every 60 s)

  # Desktop pop-ups and WhatsApp messages. WHICH jobs notify WHOM, and the message text, are in
  # config/notifications.yml (copy config/notifications.example.yml). Provider keys go in config/local.yml.
  notify:
    rules-file: ${NOTIFICATIONS_FILE:./config/notifications.yml}
    desktop-enabled: ${DESKTOP_NOTIFICATIONS:true}   # Windows pop-ups; switches itself off on a server
    dashboard-url: ${DASHBOARD_URL:http://localhost:5173}
    aws-region: ${AWS_REGION:us-west-2}
    time-zone: America/Los_Angeles
    failure-detail-wait-seconds: 90       # Step Functions: wait up to this long for the failed step + error
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:WAHA}          # WAHA (self-hosted gateway) | CALLMEBOT | TWILIO | META
      waha-url: ${WAHA_URL:http://localhost:3000}
      waha-api-key: ${WAHA_API_KEY:}                # same value as WAHA_API_KEY in deploy/waha/.env
      waha-session: ${WAHA_SESSION:default}
      proxy: ${WHATSAPP_PROXY:}                     # "host:port" if the company network needs a proxy (not for WAHA)
      twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
      twilio-from: ${TWILIO_WHATSAPP_FROM:}
      meta-phone-number-id: ${META_WA_PHONE_NUMBER_ID:}
      meta-access-token: ${META_WA_ACCESS_TOKEN:}
      meta-api-version: v21.0

  # Read-only API for the pipeline-dashboard web page (separate project). One shared sign-in.
  dashboard:
    username: ${DASHBOARD_USER:pipeline}
    password: ${DASHBOARD_PASSWORD:}         # blank: a random password is generated and logged at startup
    time-zone: America/Los_Angeles           # batch day runs midnight to midnight in this zone

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: PIPEMON
        http-only: true
        same-site: lax
        secure: ${DASHBOARD_HTTPS:false}     # true once served over https

spring:
  config:
    # Your own settings and passwords, kept out of git. Copy config/local.example.yml to config/local.yml.
    # Anything set there overrides this file (and needs no environment variables or admin rights).
    import: optional:file:./config/local.yml
  mvc:
    async:
      request-timeout: 35m                   # live-update streams; the page reconnects after this
  datasource:
    # File-based H2 so run history survives restarts on the laptop.
    url: jdbc:h2:file:./data/monitor;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always

logging:
  level:
    com.hca.monitor: INFO
