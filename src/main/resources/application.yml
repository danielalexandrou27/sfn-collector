monitor:
  sqs:
    # Set via environment variable MONITOR_SQS_QUEUE_URL, or edit here.
    queue-url: ${MONITOR_SQS_QUEUE_URL:https://sqs.us-west-2.amazonaws.com/060703039313/sfn-status-events}
    region: ${AWS_REGION:us-west-2}
    wait-time-seconds: 20        # long polling
    max-messages: 10             # batch size per receive
    visibility-timeout-seconds: 60
    credential-error-backoff-seconds: 60
    enabled: true

  informatica:
    # Turn on once the JDBC URL and a read-only account are filled in.
    enabled: ${INFA_REPO_ENABLED:false}
    # Oracle:     jdbc:oracle:thin:@//dbhost:1521/SERVICE_NAME
    # SQL Server: jdbc:sqlserver://dbhost:1433;databaseName=INFA_REPO;encrypt=true;trustServerCertificate=true
    jdbc-url: ${INFA_REPO_JDBC_URL:}
    # Credentials come from environment variables; never commit them.
    username: ${INFA_REPO_USER:}
    password: ${INFA_REPO_PASSWORD:}
    repo-schema: ${INFA_REPO_SCHEMA:}      # schema owning the OPB_ tables, e.g. INFA_REPO_PRD
    server-time-zone: America/Los_Angeles  # Informatica server's local time zone
    lookback-hours: 24
    # One-time history load on the first poll after startup, for edge discovery. Set to 0 afterwards.
    backfill-days: ${INFA_BACKFILL_DAYS:0}
    poll-interval-ms: 60000
    query-timeout-seconds: 30
    folders: []                            # e.g. [LOANS, FINANCE]; empty = all folders

  # One-time load of past Step Functions executions (ListExecutions), for edge discovery.
  sfn-backfill:
    enabled: ${SFN_BACKFILL_ENABLED:false}
    days: 30
    name-prefix: ""            # only state machines whose name starts with this; "" = all
    calls-per-second: 2        # well under the shared ListExecutions quota (5/s)

  pipelines:
    file: ${PIPELINES_FILE:./config/pipelines.yml}
    link-window-hours: 36      # how far back to look for an upstream run
    pending-grace-minutes: 3   # wait before alerting on a non-OK link (Informatica polls every 60 s)
    discovery:
      output: ./data/edge-candidates.yml
      history-days: 30
      window-minutes: 120      # upstream must finish within this long before the state machine starts
      min-days: 3
      min-support: 0.8         # on >= 80% of the days the state machine ran
      min-precision: 0.5       # >= 50% of the workflow's runs were followed by the state machine

spring:
  datasource:
    # File-based H2 so run history survives restarts on the laptop.
    url: jdbc:h2:file:./data/monitor;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always

logging:
  level:
    com.hca.monitor: INFO
