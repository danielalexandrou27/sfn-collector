# Pipeline registry: which Informatica workflow triggers which Step Function.
# One pipeline per Informatica folder; each workflow is listed once, followed by the step function(s) it feeds.
# The engine reloads this file within 30 s of saving. Names must match Informatica and AWS exactly (case too).
# Optional per step function: expected_by: "HH:mm" (Pacific) -> dashboard shows Late if not started by then.
# 43 step functions, 39 workflows, 11 folders.

